name: Build Debug APK

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to build from'
        required: false
        default: 'main'

jobs:
  build-apk:
    name: Build AirLyrics APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch || github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Link NDK for Gradle
        run: echo "ndk.dir=${{ steps.setup-ndk.outputs.ndk-path }}" > local.properties

      - name: Build Debug APK
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirLyrics-Debug-APK
          path: app/build/outputs/apk/de
          bug/*.apk
